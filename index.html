<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- iPhone 适配：从主屏幕打开时全屏独立运行，带图标和状态栏主题色 -->
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房源平台">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>房源管理平台</title>
<style>
  /* ========== 基础样式（手机优先） ========== */
  :root{
    --bg:#eef2f7; --card:#ffffff; --line:#e2e8f0; --txt:#0f172a; --sub:#64748b;
    --blue:#2563eb; --blue-dark:#1d4ed8;
    --amber:#d97706; --amber-bg:#fffbeb; --amber-line:#f59e0b;
    --green:#059669;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit; cursor:pointer;}

  /* ========== 顶部标题栏 ========== */
  .topbar{
    background:linear-gradient(135deg,#1d4ed8,#3b82f6);
    color:#fff; padding:14px 16px 12px;
  }
  .topbar h1{font-size:19px; font-weight:700; letter-spacing:1px;}
  .topbar .mode-badge{
    display:inline-block; margin-top:4px; font-size:12px; padding:2px 8px;
    background:rgba(255,255,255,.2); border-radius:99px;
  }
  .mode-badge.local{background:rgba(255,255,255,.2);}
  .mode-badge.server{background:rgba(16,185,129,.55);}

  /* ========== 统计卡片（可点击筛选） ========== */
  .stats{
    display:flex; gap:8px; padding:12px 12px 4px;
    max-width:1280px; margin:0 auto;
  }
  .stat{
    flex:1; background:var(--card); border-radius:12px; padding:10px 8px; text-align:center;
    border:1px solid var(--line); box-shadow:0 1px 2px rgba(15,23,42,.04);
    user-select:none; cursor:pointer;
  }
  .stat .num{font-size:22px; font-weight:800;}
  .stat .lab{font-size:12px; color:var(--sub); margin-top:2px;}
  .stat.vacant .num{color:var(--amber);}
  .stat.rate .num{color:var(--blue);}
  .stat:active{transform:scale(.97);}
  /* 分楼栋小计 */
  .bchips{
    display:flex; gap:8px; padding:8px 12px; max-width:1280px; margin:0 auto; flex-wrap:wrap;
  }
  .bchip{
    font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--line);
    border-radius:99px; padding:4px 10px; cursor:pointer;
  }
  .bchip b{color:var(--txt);}
  .bchip.on{border-color:var(--blue); color:var(--blue); background:#eff6ff;}

  /* ========== 工具栏（吸顶） ========== */
  .toolbar{
    position:sticky; top:0; z-index:50; background:var(--bg);
    padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    max-width:1280px; margin:0 auto;
    box-shadow:0 4px 10px -8px rgba(15,23,42,.25);
  }
  .toolbar input[type=search]{
    flex:1 1 160px; min-width:140px; height:38px; padding:0 12px;
    border:1px solid var(--line); border-radius:10px; font-size:15px; background:#fff; outline:none;
  }
  .toolbar select{
    height:38px; padding:0 6px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; background:#fff; outline:none; max-width:44vw;
  }
  .toolbar label.staronly{
    display:flex; align-items:center; gap:4px; font-size:13px; color:var(--sub);
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:0 10px; height:38px;
  }
  .btn{
    height:38px; padding:0 14px; border:none; border-radius:10px; font-size:14px;
    background:var(--blue); color:#fff; font-weight:600; white-space:nowrap;
  }
  .btn.ghost{background:#fff; color:var(--txt); border:1px solid var(--line); font-weight:400;}
  .btn:active{opacity:.85;}

  /* ========== 房源卡片网格 ========== */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:10px; padding:10px 12px 90px; max-width:1280px; margin:0 auto;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px 8px; box-shadow:0 1px 2px rgba(15,23,42,.05);
    display:flex; flex-direction:column; gap:6px;
  }
  .card.vacant-card{border-left:3px solid var(--amber-line);}
  .card.starred{border-color:#f0c36d; background:linear-gradient(180deg,#fffdf5,#fff);}
  .card-top{display:flex; align-items:center; gap:8px;}
  .bldg{
    font-size:11px; color:#fff; border-radius:6px; padding:2px 6px; flex-shrink:0; font-weight:600;
  }
  .bldg.b1{background:#2563eb;} .bldg.b2{background:#7c3aed;} .bldg.b3{background:#0d9488;}
  .room{font-size:19px; font-weight:800; letter-spacing:.5px;}
  .star-btn{
    margin-left:auto; background:none; border:none; font-size:18px; line-height:1; padding:4px;
  }
  .status{
    align-self:flex-start; border:none; border-radius:99px; font-size:12px; font-weight:700;
    padding:3px 12px;
  }
  .status.st-rented{background:#f1f5f9; color:#64748b;}
  .status.st-vacant{background:var(--amber-bg); color:var(--amber); border:1px solid #fcd34d;}
  .rows{display:flex; flex-direction:column; gap:3px; font-size:13px;}
  .row{display:flex; gap:6px; align-items:baseline;}
  .row .k{color:var(--sub); flex-shrink:0; font-size:12px;}
  .row .v{word-break:break-all;}
  .row .exp{color:var(--amber); font-weight:600;}
  .pwd{display:inline-flex; align-items:center; gap:6px;}
  .pwd .pwd-txt{font-weight:700; letter-spacing:1px;}
  .pwd button{border:1px solid var(--line); background:#f8fafc; border-radius:6px; font-size:12px; padding:1px 6px;}
  .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px;}
  .tag{font-size:11px; color:var(--blue); background:#eff6ff; border-radius:6px; padding:1px 7px;}
  .note{font-size:12px; color:var(--sub); background:#f8fafc; border-radius:8px; padding:5px 8px; word-break:break-all;}
  .ops{display:flex; gap:8px; justify-content:flex-end; margin-top:auto; padding-top:4px;}
  .ops button{
    border:1px solid var(--line); background:#fff; border-radius:8px; font-size:12px; padding:5px 12px; color:var(--sub);
  }
  .ops button.danger{color:#dc2626; border-color:#fecaca;}
  .ops button:active{background:#f1f5f9;}

  .empty{grid-column:1/-1; text-align:center; color:var(--sub); padding:60px 0; font-size:14px;}

  /* ========== 新增/编辑 弹窗（手机上是底部抽屉） ========== */
  .modal{
    position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100;
    display:none; align-items:center; justify-content:center; padding:14px;
  }
  .modal.show{display:flex;}
  .modal-card{
    background:#fff; border-radius:16px; width:min(560px,100%); max-height:92vh; overflow:auto;
    padding:16px;
  }
  .modal-card h2{font-size:16px; margin-bottom:12px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px; color:var(--sub);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:15px; outline:none; background:#fff;
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .mops{display:flex; gap:10px; margin-top:14px;}
  .mops .btn{flex:1; height:42px;}
  .mops .cancel{background:#f1f5f9; color:var(--txt);}

  /* ========== 提示条 ========== */
  #toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%);
    background:rgba(15,23,42,.88); color:#fff; font-size:13px; padding:9px 16px;
    border-radius:99px; z-index:200; display:none; max-width:86vw; text-align:center;
  }

  /* 错误横幅（连不上电脑服务时） */
  #errbar{
    display:none; background:#fef2f2; color:#b91c1c; border-bottom:1px solid #fecaca;
    padding:10px 14px; font-size:13px;
  }
  #errbar button{margin-left:8px; border:1px solid #fca5a5; background:#fff; color:#b91c1c; border-radius:8px; padding:3px 10px;}

  @media (max-width:600px){
    .modal{align-items:flex-end; padding:0;}
    .modal-card{border-radius:18px 18px 0 0; max-height:94vh;}
    .stats{padding:10px 10px 2px;}
    .room{font-size:18px;}
    /* 手机上工具栏排得更整齐：搜索占整行，其余按钮均匀分布 */
    .toolbar input[type=search]{flex:1 1 100%;}
    .toolbar select{flex:1 1 30%;}
    .toolbar .btn{flex:1 1 28%;}
  }
</style>
</head>
<body>

<!-- 顶部标题 -->
<div class="topbar">
  <h1>房源管理平台</h1>
  <span class="mode-badge" id="modeBadge">…</span>
</div>

<!-- 连接失败提示（仅服务模式） -->
<div id="errbar">⚠️ 无法连接电脑上的服务。请先在电脑双击运行「启动服务.py」，或直接打开 HTML 文件使用（数据存本机）。<button onclick="location.reload()">重试</button></div>

<!-- 统计：点按可快速筛选 -->
<div class="stats">
  <div class="stat" data-stat="all"><div class="num" id="nAll">-</div><div class="lab">总房源</div></div>
  <div class="stat" data-stat="1"><div class="num" id="nRented">-</div><div class="lab">已租</div></div>
  <div class="stat vacant" data-stat="0"><div class="num" id="nVacant">-</div><div class="lab">空置</div></div>
  <div class="stat rate" data-stat="all"><div class="num" id="nRate">-</div><div class="lab">出租率</div></div>
</div>
<div class="bchips" id="bchips"></div>

<!-- 工具栏 -->
<div class="toolbar">
  <input type="search" id="q" placeholder="🔍 搜房号 / 人名 / 备注 / 密码…" autocomplete="off">
  <select id="fB">
    <option value="all">全部楼栋</option>
    <option value="1">1号楼</option>
    <option value="2">2号楼</option>
    <option value="3">3号楼</option>
  </select>
  <select id="fStatus">
    <option value="all">全部状态</option>
    <option value="0">空置</option>
    <option value="1">已租</option>
  </select>
  <select id="fTag"><option value="all">全部标签</option></select>
  <select id="fSort">
    <option value="default">按楼栋房号</option>
    <option value="vacant">空置优先</option>
  </select>
  <label class="staronly"><input type="checkbox" id="fStar">⭐</label>
  <button class="btn" id="btnAdd">＋ 新增</button>
  <button class="btn ghost" id="btnCsv">导出Excel</button>
  <button class="btn ghost" id="btnBak">备份</button>
  <button class="btn ghost" id="btnImp">导入</button>
  <button class="btn ghost" id="btnPin" style="display:none">改密码</button>
  <input type="file" id="impFile" accept=".json" style="display:none">
</div>

<!-- 房源卡片 -->
<div class="grid" id="grid"></div>

<!-- 新增/编辑弹窗 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="mTitle">新增房源</h2>
    <div class="fgrid">
      <div class="field"><label>楼栋</label>
        <select id="f-b"><option value="1">1号楼</option><option value="2">2号楼</option><option value="3">3号楼</option></select>
      </div>
      <div class="field"><label>房号 *</label><input id="f-room" placeholder="如 1012" inputmode="numeric"></div>
      <div class="field"><label>状态</label>
        <select id="f-status"><option value="0">空置</option><option value="1">已租</option></select>
      </div>
      <div class="field"><label>相关人（租客/房东）</label><input id="f-person" placeholder="如 张三"></div>
      <div class="field"><label>密码</label><input id="f-pwd" placeholder="门锁密码" inputmode="numeric"></div>
      <div class="field"><label>租金（元/月）</label><input id="f-rent" placeholder="如 1300"></div>
      <div class="field"><label>到期 / 备注日期</label><input id="f-exp" placeholder="如 1.21到期"></div>
      <div class="field full"><label>标签（空格或逗号分隔，如：优宿 边套）</label><input id="f-tags" placeholder="优宿 边套 带阳台…"></div>
      <div class="field full"><label>备注</label><textarea id="f-note" placeholder="装修情况、约定事项等"></textarea></div>
      <div class="field full"><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--txt)">
        <input type="checkbox" id="f-star" style="width:18px;height:18px"> ⭐ 星标重点房源
      </label></div>
    </div>
    <div class="mops">
      <button class="btn cancel" id="mCancel">取消</button>
      <button class="btn" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- 访问密码解锁（仅部署加密版显示） -->
<div class="modal" id="gate">
  <div class="modal-card" style="max-width:340px">
    <h2>🔒 输入访问密码</h2>
    <div class="field full">
      <input type="password" id="gatePwd" inputmode="numeric" maxlength="6" placeholder="6位数字密码" autocomplete="off">
    </div>
    <div id="gateErr" style="display:none; color:#dc2626; font-size:13px; margin-top:8px;">密码错误，请重试</div>
    <div class="mops"><button class="btn" id="gateGo" style="flex:1; height:42px;">解锁</button></div>
    <div style="margin-top:10px; text-align:center;"><a href="javascript:void(0)" id="gateReset" style="color:#94a3b8; font-size:12px;">重置本机数据（恢复发布时的初始数据）</a></div>
  </div>
</div>

<!-- 改密码弹窗（仅加密模式显示） -->
<div class="modal" id="pinModal">
  <div class="modal-card" style="max-width:340px">
    <h2>修改访问密码</h2>
    <div class="fgrid" style="grid-template-columns:1fr">
      <div class="field"><label>当前密码</label><input type="password" id="pinOld" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="field"><label>新密码（6位数字）</label><input type="password" id="pinNew" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="field"><label>再输一次新密码</label><input type="password" id="pinNew2" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    </div>
    <div id="pinErr" style="display:none; color:#dc2626; font-size:13px; margin-top:8px;"></div>
    <div class="mops">
      <button class="btn cancel" id="pinCancel">取消</button>
      <button class="btn" id="pinSave">确认修改</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

   两种使用模式（自动识别）：

/* ---------- 工具函数 ---------- */
const KEY = 'fy_platform_v1';
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.style.display='none'; }, 1800);
}
function genId(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* 内置初始数据 → 对象数组 */
let _seedId = 0;
function seedToObjects(){
  return SEED.map(a=>({
    id:'s'+(_seedId++), b:a[0], room:a[1], status:a[2], person:a[3], pwd:a[4],
    rent:a[5], exp:a[6], tags:a[7]?a[7].split(/\s+/):[], star:a[8], note:a[9]
  }));
}

/* ---------- 存储层：三种模式自动切换 ----------
   1) 加密模式(部署版)：数据用访问密码加密(AES-256-GCM)后存本机浏览器，适合发布到互联网
   2) 服务模式：通过「启动服务.py」的网址访问 → 数据保存在电脑 data.json，手机电脑实时同步
   3) 本地模式：直接双击打开本文件 → 数据保存在本机浏览器 localStorage */
const SECURED = typeof SECURED_FLAG !== 'undefined' && SECURED_FLAG === true;
const IS_SERVER = !SECURED && (location.protocol === 'http:' || location.protocol === 'https:');
const Store = {
  _timer:null,
  key:null,    // 加密模式：解锁后持有的会话密钥
  salt:null,   // 加密模式：密钥派生所用的盐值（与密钥绑定，保存时复用）
  /* 读取数据 */
  async load(){
    if(SECURED){
      const res = await unlockFlow();
      this.key = res.key;
      this.salt = res.salt;
      if(!hasLocalBlob()) this._saveSecured(res.data);   // 首次解锁：把内置加密种子存到本机
      return res.data;
    }
    if(IS_SERVER){
      let res;
      try{ res = await fetch('/api/data', {cache:'no-store'}); }
      catch(e){ throw new Error('无法连接服务'); }
      if(res.ok){
        const d = await res.json();
        if(Array.isArray(d) && d.length) return d;
      }
      /* 服务器还没有数据：把内置初始数据写入电脑，完成首次同步 */
      const seed = seedToObjects();
      this.save(seed);
      return seed;
    }
    try{
      const s = localStorage.getItem(KEY);
      if(s !== null){ const d = JSON.parse(s); if(Array.isArray(d)) return d; }
    }catch(e){}
    const seed = seedToObjects();
    this._saveLocal(seed);
    return seed;
  },
  /* 保存数据（改动后统一调用） */
  save(rooms){
    if(SECURED){ this._saveSecured(rooms); return; }
    if(IS_SERVER){
      clearTimeout(this._timer);
      this._timer = setTimeout(()=>{
        fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rooms)})
          .catch(()=>toast('⚠️ 同步到电脑失败，改动可能未保存'));
      }, 500);
    }else{
      this._saveLocal(rooms);
    }
  },
  /* 加密模式：用会话密钥加密后写入本机（盐值必须与密钥派生时一致） */
  async _saveSecured(rooms){
    if(!this.key || !this.salt) return;
    try{
      const data = await encryptWithKey(this.key, rooms, this.salt);
      localStorage.setItem(KEY, JSON.stringify({v:1, data}));
    }catch(e){ toast('⚠️ 保存失败'); }
  },
  _saveLocal(rooms){ try{ localStorage.setItem(KEY, JSON.stringify(rooms)); }catch(e){ toast('⚠️ 本机存储失败'); } }
};

/* ---------- 加密模式的密码学工具（与构建脚本格式一致：salt|iv|tag|ct） ---------- */
function b64(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); } return btoa(s); }
function unb64(str){ const s=atob(str); const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
/* 由访问密码派生密钥：PBKDF2-SHA256 25万次迭代 */
async function deriveKeyFromPin(pin, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km,
    {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}
/* 加密：返回 base64(salt|iv|tag|ct) */
async function encryptWithKey(key, obj, salt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj))));
  const body = ct.slice(0, ct.length-16), tag = ct.slice(ct.length-16);   // WebCrypto 输出=密文+校验码
  const out = new Uint8Array(16+12+16+body.length);
  out.set(salt,0); out.set(iv,16); out.set(tag,28); out.set(body,44);
  return b64(out);
}
/* 解密：输入 base64(salt|iv|tag|ct) */
async function decryptWithKey(key, raw){
  const iv = raw.slice(16,28), tag = raw.slice(28,44), ct = raw.slice(44);
  const joined = new Uint8Array(ct.length + tag.length);
  joined.set(ct); joined.set(tag, ct.length);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, joined);
  return JSON.parse(new TextDecoder().decode(pt));
}
/* 当前应解锁的数据块：优先本机已存的加密数据，否则用内置加密种子（忽略旧格式数据） */
function hasLocalBlob(){
  const s = localStorage.getItem(KEY);
  if(!s) return false;
  try{ const o = JSON.parse(s); return !!(o && o.v===1 && typeof o.data==='string'); }catch(e){ return false; }
}
/* 取待解锁数据的二进制：本机存的是 JSON{v:1,data}，内置种子是纯 base64 */
function currentBlobRaw(){
  if(hasLocalBlob()) return unb64(JSON.parse(localStorage.getItem(KEY)).data);
  if(typeof ENCRYPTED_SEED !== 'undefined') return unb64(ENCRYPTED_SEED);
  throw new Error('没有可解锁的数据');
}
/* 解锁流程：会话内有缓存密钥则免输密码，否则弹出密码框 */
async function unlockFlow(){
  const cached = sessionStorage.getItem('fy_key');
  if(cached){
    try{
      const key = await crypto.subtle.importKey('raw', unb64(cached), 'AES-GCM', false, ['encrypt','decrypt']);
      const raw = currentBlobRaw();
      const data = await decryptWithKey(key, raw);
      return {key, data, salt: raw.slice(0,16)};
    }catch(e){ sessionStorage.removeItem('fy_key'); }
  }
  return askPin();
}
/* 弹出访问密码输入框 */
function askPin(){
  return new Promise(resolve=>{
    const gate=$('gate'), inp=$('gatePwd'), err=$('gateErr'), btn=$('gateGo');
    gate.classList.add('show'); err.style.display='none'; inp.value='';
    setTimeout(()=>inp.focus(), 100);
    async function attempt(){
      const pin = inp.value.trim();
      if(!/^\d{6}$/.test(pin)){ err.textContent='请输入6位数字密码'; err.style.display='block'; return; }
      btn.disabled = true; btn.textContent = '解锁中…';
      try{
        const raw = currentBlobRaw();
        const key = await deriveKeyFromPin(pin, raw.slice(0,16));
        const data = await decryptWithKey(key, raw);
        sessionStorage.setItem('fy_key', b64(new Uint8Array(await crypto.subtle.exportKey('raw', key))));
        gate.classList.remove('show');
        resolve({key, data, salt: raw.slice(0,16)});
      }catch(e){
        err.textContent = '密码错误，请重试'; err.style.display='block'; inp.value='';
      }finally{ btn.disabled=false; btn.textContent='解锁'; }
    }
    btn.onclick = attempt;
    inp.onkeydown = e=>{ if(e.key==='Enter') attempt(); };
    $('gateReset').onclick = ()=>{
      if(confirm('将清除本机保存的数据，恢复为发布时的初始数据（仍需访问密码解锁）。确定吗？')){
        localStorage.removeItem(KEY); sessionStorage.clear(); location.reload();
      }
    };
  });
}

/* ---------- 全局状态 ---------- */
let rooms = [];
let editingId = null;                       // 当前编辑的房源 id（null=新增）
const filters = { q:'', b:'all', status:'all', tag:'all', starOnly:false, sort:'default' };

/* ---------- 渲染 ---------- */
function applyFilters(list){
  let out = list.filter(r=>{
    if(filters.b!=='all' && String(r.b)!==filters.b) return false;
    if(filters.status!=='all' && String(r.status)!==filters.status) return false;
    if(filters.starOnly && !r.star) return false;
    if(filters.tag!=='all' && !(r.tags||[]).includes(filters.tag)) return false;
    if(filters.q){
      const hay = [r.room,r.person,r.note,r.pwd,r.rent,r.exp,(r.tags||[]).join(' '),r.b+'号楼']
        .join(' ').toLowerCase();
      if(!hay.includes(filters.q.toLowerCase())) return false;
    }
    return true;
  });
  const byRoom = (a,b2)=> (parseInt(a.room,10)||0)-(parseInt(b2.room,10)||0) || a.room.localeCompare(b2.room,'zh');
  out.sort((a,b2)=> a.b!==b2.b ? a.b-b2.b : byRoom(a,b2));
  if(filters.sort==='vacant') out.sort((a,b2)=> a.status-b2.status);  // 空置(0)排前面
  return out;
}

function cardHtml(r){
  const rented = r.status===1;
  const rentTxt = r.rent ? (/^\d+$/.test(r.rent) ? esc(r.rent)+' 元/月' : esc(r.rent)) : '';
  return `<div class="card ${rented?'':'vacant-card'} ${r.star?'starred':''}" data-id="${r.id}">
    <div class="card-top">
      <span class="bldg b${r.b}">${r.b}号楼</span>
      <span class="room">${esc(r.room)}</span>
      <button class="star-btn" data-action="star" title="星标">${r.star?'⭐':'☆'}</button>
    </div>
    <button class="status ${rented?'st-rented':'st-vacant'}" data-action="toggle" title="点击切换已租/空置">${rented?'已租':'空置'}</button>
    <div class="rows">
      ${r.person?`<div class="row"><span class="k">相关人</span><span class="v">${esc(r.person)}</span></div>`:''}
      ${rentTxt?`<div class="row"><span class="k">租金</span><span class="v">${rentTxt}</span></div>`:''}
      ${r.pwd?`<div class="row"><span class="k">密码</span><span class="pwd" data-pwd="${esc(r.pwd)}">
        <span class="pwd-txt">••••••</span>
        <button data-action="eye">显示</button><button data-action="copy">复制</button></span></div>`:''}
      ${r.exp?`<div class="row"><span class="k">到期</span><span class="v exp">⏰ ${esc(r.exp)}</span></div>`:''}
      ${(r.tags&&r.tags.length)?`<div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
      ${r.note?`<div class="note">📝 ${esc(r.note)}</div>`:''}
    </div>
    <div class="ops">
      <button data-action="edit">编辑</button>
      <button data-action="del" class="danger">删除</button>
    </div>
  </div>`;
}

function render(){
  const list = applyFilters(rooms);
  $('grid').innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">没有符合条件的房源</div>';

  /* 统计 */
  const total = rooms.length;
  const rented = rooms.filter(r=>r.status===1).length;
  $('nAll').textContent = total;
  $('nRented').textContent = rented;
  $('nVacant').textContent = total-rented;
  $('nRate').textContent = total ? Math.round(rented/total*100)+'%' : '-';

  /* 分楼栋小计（点击可筛选） */
  const chipHtml = [1,2,3].map(b=>{
    const all = rooms.filter(r=>r.b===b);
    const rk = all.filter(r=>r.status===1).length;
    const on = filters.b===String(b)?' on':'';
    return `<span class="bchip${on}" data-b="${b}"><b>${b}号楼</b> ${all.length}套 · 租${rk} · 空${all.length-rk}</span>`;
  }).join('');
  $('bchips').innerHTML = chipHtml;

  /* 标签下拉选项（保留当前选择） */
  const tags = [...new Set(rooms.flatMap(r=>r.tags||[]))].sort();
  const cur = filters.tag;
  $('fTag').innerHTML = '<option value="all">全部标签</option>' +
    tags.map(t=>`<option value="${esc(t)}" ${t===cur?'selected':''}>${esc(t)}</option>`).join('');
  if(cur!=='all' && !tags.includes(cur)){ filters.tag='all'; $('fTag').value='all'; }
}

function persist(){ Store.save(rooms); }

/* ---------- 复制（兼容局域网 http 的降级方案） ---------- */
function copyText(t){
  const done = ()=>toast('已复制：'+t);
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>legacyCopy(t,done));
  }else legacyCopy(t,done);
}
function legacyCopy(t,done){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

/* ---------- 卡片区事件（事件委托） ---------- */
$('grid').addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]');
  const card = e.target.closest('.card');
  if(!btn || !card) return;
  const r = rooms.find(x=>x.id===card.dataset.id);
  if(!r) return;
  const act = btn.dataset.action;
  if(act==='toggle'){                    // 点状态徽章：已租 ↔ 空置
    r.status = r.status===1 ? 0 : 1;
    persist(); render();
    toast(`${r.b}号楼 ${r.room} 已标记为${r.status===1?'已租':'空置'}`);
  }else if(act==='star'){
    r.star = r.star?0:1; persist(); render();
  }else if(act==='eye'){
    const box = btn.closest('.pwd'), txt = box.querySelector('.pwd-txt');
    const hidden = txt.textContent.indexOf('•')===0;
    txt.textContent = hidden ? box.dataset.pwd : '••••••';
    btn.textContent = hidden ? '隐藏' : '显示';
  }else if(act==='copy'){
    copyText(btn.closest('.pwd').dataset.pwd);
  }else if(act==='edit'){
    openModal(r);
  }else if(act==='del'){
    if(confirm(`确定删除 ${r.b}号楼 ${r.room} 吗？`)){
      rooms = rooms.filter(x=>x.id!==r.id); persist(); render(); toast('已删除');
    }
  }
});

/* ---------- 统计卡片 / 楼栋小条 点击筛选 ---------- */
document.querySelectorAll('.stat').forEach(el=>{
  el.addEventListener('click', ()=>{
    const s = el.dataset.stat;
    if(s==='all'){ filters.status='all'; filters.b='all'; $('fStatus').value='all'; $('fB').value='all'; }
    else { filters.status=s; $('fStatus').value=s; }
    render();
  });
});
$('bchips').addEventListener('click', e=>{
  const chip = e.target.closest('.bchip'); if(!chip) return;
  const b = chip.dataset.b;
  filters.b = (filters.b===b) ? 'all' : b;
  $('fB').value = filters.b;
  render();
});

/* ---------- 筛选控件 ---------- */
$('q').addEventListener('input', e=>{ filters.q = e.target.value.trim(); render(); });
$('fB').addEventListener('change', e=>{ filters.b = e.target.value; render(); });
$('fStatus').addEventListener('change', e=>{ filters.status = e.target.value; render(); });
$('fTag').addEventListener('change', e=>{ filters.tag = e.target.value; render(); });
$('fSort').addEventListener('change', e=>{ filters.sort = e.target.value; render(); });
$('fStar').addEventListener('change', e=>{ filters.starOnly = e.target.checked; render(); });

/* ---------- 新增 / 编辑弹窗 ---------- */
function openModal(r){
  editingId = r ? r.id : null;
  $('mTitle').textContent = r ? `编辑 ${r.b}号楼 ${r.room}` : '新增房源';
  $('f-b').value     = r ? r.b : (filters.b!=='all'?filters.b:'1');
  $('f-room').value  = r ? r.room : '';
  $('f-status').value= r ? String(r.status) : '0';
  $('f-person').value= r ? (r.person||'') : '';
  $('f-pwd').value   = r ? (r.pwd||'') : '';
  $('f-rent').value  = r ? (r.rent||'') : '';
  $('f-exp').value   = r ? (r.exp||'') : '';
  $('f-tags').value  = r ? (r.tags||[]).join(' ') : '';
  $('f-note').value  = r ? (r.note||'') : '';
  $('f-star').checked= r ? !!r.star : false;
  $('modal').classList.add('show');
  setTimeout(()=>$('f-room').focus(), 50);
}
function closeModal(){ $('modal').classList.remove('show'); editingId=null; }

$('btnAdd').addEventListener('click', ()=>openModal(null));
$('mCancel').addEventListener('click', closeModal);
$('modal').addEventListener('click', e=>{ if(e.target===$('modal')) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

$('mSave').addEventListener('click', ()=>{
  const b = parseInt($('f-b').value,10);
  const room = $('f-room').value.trim();
  if(!room){ toast('请填写房号'); return; }
  /* 同楼栋同房号查重 */
  if(rooms.some(x=>x.id!==editingId && x.b===b && x.room===room)){
    if(!confirm(`${b}号楼已存在房号 ${room}，仍要保存吗？`)) return;
  }
  const data = {
    b, room,
    status: parseInt($('f-status').value,10),
    person: $('f-person').value.trim(),
    pwd:    $('f-pwd').value.trim(),
    rent:   $('f-rent').value.trim(),
    exp:    $('f-exp').value.trim(),
    tags:   $('f-tags').value.split(/[\s,，、]+/).filter(Boolean),
    star:   $('f-star').checked ? 1 : 0,
    note:   $('f-note').value.trim()
  };
  if(editingId){
    const i = rooms.findIndex(x=>x.id===editingId);
    if(i>-1) rooms[i] = Object.assign({id:editingId}, data);
  }else{
    rooms.push(Object.assign({id:genId()}, data));
  }
  persist(); render(); closeModal();
  toast('已保存');
});

/* ---------- 导出 CSV（Excel 可直接打开，含 BOM 防乱码） ---------- */
function csvCell(v){ v = String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }
$('btnCsv').addEventListener('click', ()=>{
  const head = ['楼栋','房号','状态','相关人','密码','租金','到期','标签','星标','备注'];
  const lines = [head.map(csvCell).join(',')];
  applyFilters(rooms).forEach(r=>{
    lines.push([r.b+'号楼',r.room,r.status===1?'已租':'空置',r.person,r.pwd,r.rent,r.exp,
      (r.tags||[]).join(' '),r.star?'是':'',r.note].map(csvCell).join(','));
  });
  download('\ufeff'+lines.join('\r\n'), `房源数据_${dateStr()}.csv`, 'text/csv;charset=utf-8');
  toast('已导出 CSV（注意：包含密码，请妥善保管）');
});

/* ---------- 备份 / 导入 JSON ---------- */
$('btnBak').addEventListener('click', async ()=>{
  if(SECURED){
    /* 加密模式：导出的备份同样是密文，需访问密码才能解锁 */
    const data = await encryptWithKey(Store.key, rooms, Store.salt);
    download(JSON.stringify({fy:'secured', v:1, data}), `房源加密备份_${dateStr()}.json`, 'application/json');
    toast('已导出加密备份（解锁需访问密码）');
    return;
  }
  download(JSON.stringify(rooms,null,1), `房源备份_${dateStr()}.json`, 'application/json');
  toast('已导出 JSON 备份');
});
$('btnImp').addEventListener('click', ()=>$('impFile').click());
$('impFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(d && d.fy==='secured' && d.data){
        /* 加密备份：原样存入本机，刷新后用该备份的访问密码解锁 */
        if(confirm('将导入加密备份，导入后需用该备份对应的访问密码解锁，并覆盖本机当前数据。确定吗？')){
          localStorage.setItem(KEY, JSON.stringify({v:1, data:d.data}));
          location.reload();
        }
        return;
      }
      if(!Array.isArray(d) || !d.length || !d[0].room) throw new Error('格式不对');
      if(confirm(`将导入 ${d.length} 条房源并覆盖当前数据，确定吗？`)){
        rooms = d;
        if(SECURED) await Store._saveSecured(rooms); else persist();
        render(); toast('导入成功');
      }
    }catch(err){ toast('导入失败：不是有效的备份文件'); }
  };
  rd.readAsText(f, 'utf-8');
  e.target.value = '';
});

/* ---------- 改密码（仅加密模式，页面内弹窗） ---------- */
$('btnPin').addEventListener('click', ()=>{
  ['pinOld','pinNew','pinNew2'].forEach(id=>$(id).value='');
  $('pinErr').style.display='none';
  $('pinModal').classList.add('show');
  setTimeout(()=>$('pinOld').focus(), 80);
});
$('pinCancel').addEventListener('click', ()=>$('pinModal').classList.remove('show'));
$('pinModal').addEventListener('click', e=>{ if(e.target===$('pinModal')) $('pinModal').classList.remove('show'); });
$('pinSave').addEventListener('click', async ()=>{
  const o=$('pinOld').value.trim(), n=$('pinNew').value.trim(), n2=$('pinNew2').value.trim();
  const err=m=>{ const el=$('pinErr'); el.textContent=m; el.style.display='block'; };
  if(!/^\d{6}$/.test(o) || !/^\d{6}$/.test(n)){ err('密码必须是6位数字'); return; }
  if(n!==n2){ err('两次输入的新密码不一致'); return; }
  try{
    const raw = currentBlobRaw();
    await decryptWithKey(await deriveKeyFromPin(o, raw.slice(0,16)), raw);   // 验证当前密码
  }catch(e){ err('当前密码不正确'); return; }
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const newKey = await deriveKeyFromPin(n, salt);
  const data = await encryptWithKey(newKey, rooms, salt);
  localStorage.setItem(KEY, JSON.stringify({v:1, data}));
  Store.key = newKey;
  Store.salt = salt;
  sessionStorage.setItem('fy_key', b64(new Uint8Array(await crypto.subtle.exportKey('raw', newKey))));
  $('pinModal').classList.remove('show');
  toast('密码已修改，本机数据已用新密码重新加密');
});

function dateStr(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}
function download(content, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 启动 ---------- */
(async function init(){
  $('modeBadge').className = 'mode-badge ' + (SECURED ? 'server' : (IS_SERVER?'server':'local'));
  $('modeBadge').textContent = SECURED ? '🔒 已加密 · 输访问密码解锁'
                              : IS_SERVER ? '服务模式 · 手机电脑数据同步' : '本地模式 · 数据存本机';
  try{
    rooms = await Store.load();
    if(SECURED) $('btnPin').style.display = '';   // 解锁成功后显示改密码入口
  }catch(e){
    $('errbar').style.display = 'block';
    rooms = (typeof SEED !== 'undefined') ? seedToObjects() : [];   // 先展示内置数据，恢复连接后刷新即可
  }
  render();
})();
</script>
